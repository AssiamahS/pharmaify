name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (iOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on iPhone simulator
        run: |
          set -o pipefail
          pick_sim() {
            xcrun simctl list devices available --json \
              | jq -r '[.devices[] | .[] | select(.isAvailable and (.name | test("^iPhone")))] | first | .udid // empty'
          }
          UDID=$(pick_sim)
          if [ -z "$UDID" ]; then
            echo "no iPhone simulator on image — installing iOS platform"
            sudo xcodebuild -runFirstLaunch
            xcodebuild -downloadPlatform iOS
            UDID=$(pick_sim)
          fi
          test -n "$UDID"
          echo "using simulator $UDID"
          xcodebuild test \
            -project Pharmaify.xcodeproj \
            -scheme Pharmaify \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO


  ipa:
    name: Package unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pharmaify.xcodeproj \
            -scheme Pharmaify \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/Pharmaify.app" Payload/
          zip -qry Pharmaify-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pharmaify-unsigned-ipa
          path: Pharmaify-unsigned.ipa
          retention-days: 30


  adhoc:
    # Sideload lane: ad hoc IPA for registered iPhones, served from GitHub Pages via itms-services.
    # Exists because a billing hold on the Apple Account blocks every TestFlight install.
    # Archive is UNSIGNED on purpose: a cloud-signed archive mints a throwaway dev cert per run
    # and trips the 10-certificate cap; exportArchive does the real signing.
    name: Ad hoc IPA -> install page
    runs-on: macos-26
    timeout-minutes: 45
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: write
    concurrency:
      group: adhoc-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          cp "$RUNNER_TEMP/asc/AuthKey.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project (iPhone only)
        run: |
          sed -i '' "s/^    CURRENT_PROJECT_VERSION: .*/    CURRENT_PROJECT_VERSION: $GITHUB_RUN_NUMBER/" project.yml
          xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Pharmaify.xcodeproj \
            -scheme Pharmaify \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Pharmaify.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER
      - name: Export ad hoc IPA (cloud signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Pharmaify.xcarchive \
            -exportOptionsPlist ExportOptionsAdHoc.plist \
            -exportPath build/adhoc \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/adhoc
      - name: Publish install page to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p web/ipa
          cp build/adhoc/*.ipa web/ipa/Pharmaify.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Pharmaify.xcarchive/Products/Applications/Pharmaify.app/Info.plist)
          cat > web/ipa/manifest.plist <<EOF2
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array>
              <dict><key>kind</key><string>software-package</string><key>url</key><string>https://assiamahs.github.io/pharmaify/ipa/Pharmaify.ipa</string></dict>
              <dict><key>kind</key><string>display-image</string><key>url</key><string>https://assiamahs.github.io/pharmaify/icon-180.png</string></dict>
              <dict><key>kind</key><string>full-size-image</string><key>url</key><string>https://assiamahs.github.io/pharmaify/icon-512.png</string></dict>
            </array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>com.assiamah.pharmaify</string>
              <key>bundle-version</key><string>${VERSION}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Pharmaify</string>
            </dict>
          </dict></array></dict></plist>
          EOF2
          sed -i '' -E "s/Build [^·]*· [^·]*·/Build $GITHUB_RUN_NUMBER (v$VERSION) · $(date -u +%Y-%m-%d) ·/; s/BUILD_NUMBER/$GITHUB_RUN_NUMBER/; s/BUILD_DATE/$(date -u +%Y-%m-%d)/" web/install.html || true
          git checkout -- project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/ipa web/install.html
          git commit -m "build: ad hoc IPA build $GITHUB_RUN_NUMBER" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
