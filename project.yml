name: Pharmaify
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  Pharmaify:
    type: application
    platform: iOS
    sources:
      - Pharmaify
    info:
      path: Pharmaify/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Pharmaify
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Pharmaify attaches a photo of your prescription to a refill request.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.pharmaify
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PharmaifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PharmaifyTests
      - path: Pharmaify/Models.swift

schemes:
  Pharmaify:
    build:
      targets:
        Pharmaify: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PharmaifyTests
